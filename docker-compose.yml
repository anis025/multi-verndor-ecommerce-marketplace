services:
  mongodb:
    image: mongo:7
    container_name: hatify-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped


  backend:
    build: ./backend
    container_name: hatify-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - APP_NAME=Hatify
      - APP_ENV=development
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=hatify_db
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=60
      - FRONTEND_URL=http://localhost
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: hatify-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
  uploads_data:
